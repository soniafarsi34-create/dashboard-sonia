<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Antiquarium Manager — Sonia</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
 --bg:#05070c;
 --card:#0d1119;
 --gold:#d4af37;
 --txt:#eee;
 --muted:#777;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--txt);
 font-family:Inter,sans-serif;
}

/* HEADER */

header{
 background:#0a0e15;
 padding:18px 25px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #1b1f2a;
}

header h2{color:var(--gold)}

nav a{
 color:var(--txt);
 margin-left:18px;
 cursor:pointer;
 font-size:14px;
}

nav a:hover{color:var(--gold)}

/* LAYOUT */

.container{
 max-width:1400px;
 margin:auto;
 padding:25px;
}

.page{display:none}
.page.active{display:block}

.card{
 background:var(--card);
 border-radius:18px;
 padding:22px;
 margin-bottom:22px;
 border:1px solid #1b1f2a;
}

h3{color:var(--gold)}

/* FORM */

input,select,textarea{
 width:100%;
 background:#080b12;
 border:1px solid #222;
 color:var(--txt);
 padding:10px;
 border-radius:8px;
 margin:6px 0;
}

button{
 background:var(--gold);
 color:black;
 border:none;
 padding:12px 20px;
 border-radius:10px;
 font-weight:700;
 cursor:pointer;
}

button:hover{opacity:.9}

/* TABLE */

table{
 width:100%;
 border-collapse:collapse;
 font-size:14px;
}

th,td{
 padding:8px;
 border-bottom:1px solid #222;
}

th{color:var(--gold)}

/* KPI */

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:15px;
}

.kpi{
 background:#080b12;
 border:1px solid #222;
 border-radius:12px;
 padding:12px;
 text-align:center;
}

.kpi b{color:var(--gold);font-size:22px}

/* CHAT */

.chat{
 height:220px;
 overflow:auto;
 background:#080b12;
 border:1px solid #222;
 border-radius:12px;
 padding:10px;
}

.user{color:var(--gold)}
.ai{color:var(--txt)}

</style>
</head>

<body>

<header>

<h2>ANTIQUARIUM MANAGER</h2>

<nav>
<a onclick="go('dashboard')">Dashboard</a>
<a onclick="go('sales')">Vendite</a>
<a onclick="go('buys')">Acquisti</a>
<a onclick="go('stock')">Magazzino</a>
<a onclick="go('analytics')">Analytics</a>
<a onclick="go('catalog')">Catalogo</a>
<a onclick="go('advisor')">AI</a>
<a onclick="go('backup')">Backup</a>
</nav>

</header>

<div class="container">

<!-- DASHBOARD -->
<div id="dashboard" class="page active">

<div class="card">
<h3>📊 Riepilogo</h3>
<div class="grid" id="kpi"></div>
</div>

<div class="card">
<canvas id="mainChart"></canvas>
</div>

</div>


<!-- SALES -->
<div id="sales" class="page">

<div class="card">
<h3>➕ Nuova Vendita</h3>

<input id="s_name" placeholder="Oggetto">
<input id="s_price" placeholder="Prezzo vendita">
<input id="s_cost" placeholder="Costo acquisto">
<input id="s_date" type="date">

<button onclick="addSale()">Salva</button>
</div>

<div class="card">
<h3>📁 Storico Vendite</h3>
<table id="salesTable"></table>
</div>

</div>


<!-- BUYS -->
<div id="buys" class="page">

<div class="card">
<h3>➕ Nuovo Acquisto</h3>

<input id="b_name" placeholder="Oggetto">
<input id="b_price" placeholder="Prezzo acquisto">
<input id="b_date" type="date">

<button onclick="addBuy()">Salva</button>
</div>

<div class="card">
<h3>📁 Storico Acquisti</h3>
<table id="buysTable"></table>
</div>

</div>


<!-- STOCK -->
<div id="stock" class="page">

<div class="card">
<h3>📦 Magazzino</h3>
<table id="stockTable"></table>
</div>

</div>


<!-- ANALYTICS -->
<div id="analytics" class="page">

<div class="card">
<h3>📈 Andamento Mensile</h3>
<canvas id="chart1"></canvas>
</div>

<div class="card">
<h3>💰 Profitti</h3>
<canvas id="chart2"></canvas>
</div>

</div>


<!-- CATALOG -->
<div id="catalog" class="page">

<div class="card">
<h3>📝 Scheda Opera AI</h3>

<input id="c_name" placeholder="Nome opera">
<input id="c_era" placeholder="Epoca">
<input id="c_mat" placeholder="Materiale">
<input id="c_dim" placeholder="Dimensioni">

<button onclick="describe()">Genera Descrizione</button>

<div id="desc"></div>
</div>

</div>


<!-- AI -->
<div id="advisor" class="page">

<div class="card">
<h3>🤖 AI Advisor</h3>

<div class="chat" id="chat"></div>

<input id="q" placeholder="Chiedi qualcosa...">

<button onclick="ask()">Invia</button>

</div>

</div>


<!-- BACKUP -->
<div id="backup" class="page">

<div class="card">
<h3>💾 Backup Dati</h3>

<button onclick="exportData()">Scarica Backup</button>

</div>

</div>

</div>


<script>

let sales=JSON.parse(localStorage.getItem("sales")||"[]");
let buys=JSON.parse(localStorage.getItem("buys")||"[]");

let mainChart,chart1,chart2;


/* NAV */

function go(p){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(p).classList.add("active");
}


/* SAVE */

function save(){
 localStorage.setItem("sales",JSON.stringify(sales));
 localStorage.setItem("buys",JSON.stringify(buys));
}


/* ADD SALE */

function addSale(){

let o={
 name:s_name.value,
 price:+s_price.value,
 cost:+s_cost.value,
 date:s_date.value
};

if(!o.name||!o.price)return alert("Compila tutti i campi");

sales.push(o);
save();

s_name.value="";
s_price.value="";
s_cost.value="";
s_date.value="";

render();
}


/* ADD BUY */

function addBuy(){

let o={
 name:b_name.value,
 price:+b_price.value,
 date:b_date.value
};

if(!o.name||!o.price)return alert("Compila tutti i campi");

buys.push(o);
save();

b_name.value="";
b_price.value="";
b_date.value="";

render();
}


/* RENDER */

function render(){

renderSales();
renderBuys();
renderStock();
renderKPI();
renderCharts();
renderAI();

}


/* TABLES */

function renderSales(){

let h="<tr><th>Oggetto</th><th>Prezzo</th><th>Costo</th><th>Profitto</th><th>Data</th></tr>";

sales.forEach(s=>{
 h+=`
 <tr>
 <td>${s.name}</td>
 <td>${s.price}€</td>
 <td>${s.cost}€</td>
 <td>${(s.price-s.cost)}€</td>
 <td>${s.date}</td>
 </tr>`;
});

salesTable.innerHTML=h;
}


function renderBuys(){

let h="<tr><th>Oggetto</th><th>Prezzo</th><th>Data</th></tr>";

buys.forEach(b=>{
 h+=`
 <tr>
 <td>${b.name}</td>
 <td>${b.price}€</td>
 <td>${b.date}</td>
 </tr>`;
});

buysTable.innerHTML=h;
}


function renderStock(){

let sold=sales.map(x=>x.name);

let h="<tr><th>Oggetto</th><th>Costo</th><th>Stato</th></tr>";

buys.forEach(b=>{

let st=sold.includes(b.name)?"Venduto":"In magazzino";

h+=`
<tr>
<td>${b.name}</td>
<td>${b.price}€</td>
<td>${st}</td>
</tr>`;
});

stockTable.innerHTML=h;
}


/* KPI */

function renderKPI(){

let rev=sales.reduce((a,b)=>a+b.price,0);
let cost=buys.reduce((a,b)=>a+b.price,0);
let prof=rev-cost;

kpi.innerHTML=`

<div class="kpi"><b>${rev}€</b><br>Entrate</div>
<div class="kpi"><b>${cost}€</b><br>Uscite</div>
<div class="kpi"><b>${prof}€</b><br>Utile</div>
<div class="kpi"><b>${sales.length}</b><br>Vendite</div>

`;
}


/* CHARTS */

function renderCharts(){

let m={};

sales.forEach(s=>{
 let k=s.date?.slice(0,7);
 if(k)m[k]=(m[k]||0)+s.price;
});

let labels=Object.keys(m);
let values=Object.values(m);

if(mainChart)mainChart.destroy();

mainChart=new Chart(mainChartCtx,{
 type:"line",
 data:{
  labels,
  datasets:[{
   label:"Ricavi",
   data:values,
   borderColor:"#d4af37"
  }]
 }
});


let profs={};

sales.forEach(s=>{
 let k=s.date?.slice(0,7);
 let p=s.price-s.cost;
 if(k)profs[k]=(profs[k]||0)+p;
});

if(chart2)chart2.destroy();

chart2=new Chart(chart2Ctx,{
 type:"bar",
 data:{
  labels:Object.keys(profs),
  datasets:[{
   label:"Profitto",
   data:Object.values(profs),
   backgroundColor:"#d4af37"
  }]
 }
});

}


/* AI */

function renderAI(){

let rev=sales.reduce((a,b)=>a+b.price,0);
let cost=buys.reduce((a,b)=>a+b.price,0);

let txt="Sistema attivo.";

if(cost>rev) txt="⚠️ Stai spendendo più di quanto incassi.";
if(rev>cost) txt="✅ Business in crescita.";

chat.innerHTML=`<div class="ai">${txt}</div>`;
}


function ask(){

let qv=q.value;

chat.innerHTML+=`<div class="user">${qv}</div>`;

let r="Strategia: punta su pezzi rari e certificati.";

if(qv.includes("perdo")) r="Riduci costi e aumenta margini.";
if(qv.includes("prezzi")) r="Aumenta del 5-10% sui bestseller.";

setTimeout(()=>{
 chat.innerHTML+=`<div class="ai">${r}</div>`;
 chat.scrollTop=chat.scrollHeight;
},400);

q.value="";
}


/* BACKUP */

function exportData(){

let data={sales,buys};

let blob=new Blob([JSON.stringify(data)],{type:"application/json"});

let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="antiquarium_backup.json";
a.click();
}


/* INIT */

const mainChartCtx=document.getElementById("mainChart");
const chart1Ctx=document.getElementById("chart1");
const chart2Ctx=document.getElementById("chart2");

render();

</script>

</body>
</html>
