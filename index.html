<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Sonia AI Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

h1{text-align:center}

.box{
  background:white;
  padding:15px;
  margin:15px 0;
  border-radius:10px;
  box-shadow:0 0 8px #ccc;
}

button{
  width:100%;
  padding:12px;
  background:#6c63ff;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
}

input{
  width:100%;
  padding:8px;
  margin:5px 0;
}

.chat{
  height:180px;
  overflow:auto;
  border:1px solid #ddd;
  padding:10px;
}
</style>
</head>

<body>

<h1>🤖 Sonia Business AI</h1>

<div class="box">
<h3>📂 Carica Excel / CSV</h3>
<input type="file" id="file">
<button onclick="loadFile()">Analizza</button>
</div>

<div class="box">
<h3>💰 Sintesi</h3>
<div id="totali"></div>
</div>

<div class="box">
<h3>🏪 Canali</h3>
<canvas id="canali"></canvas>
</div>

<div class="box">
<h3>🎨 Tipologie</h3>
<canvas id="tipi"></canvas>
</div>

<div class="box">
<h3>🧠 Consigli AI</h3>
<div id="insight"></div>
</div>

<div class="box">
<h3>💬 Chat</h3>
<div class="chat" id="chat"></div>
<input id="q" placeholder="Scrivi una domanda...">
<button onclick="ask()">Chiedi</button>
</div>

<script>

let dati=[];
let stats={};

function loadFile(){

let f=document.getElementById("file").files[0];
if(!f){alert("Carica un file");return;}

let r=new FileReader();

r.onload=e=>{
 let wb=XLSX.read(e.target.result,{type:"binary"});
 let sh=wb.Sheets[wb.SheetNames[0]];
 dati=XLSX.utils.sheet_to_json(sh);
 analizza();
};

r.readAsBinaryString(f);
}


function analizza(){

let canali={},tipi={};
let tot=0,prof=0;

dati.forEach(r=>{

 let p=Number(r["prezzo di vendita"]||0);
 let pr=Number(r["profitto"]||0);

 let c=r["luogo di vendita"];
 let t=r["TIPOLOGIA"];

 if(p>0){

  tot+=p;
  prof+=pr;

  if(c) canali[c]=(canali[c]||0)+p;
  if(t) tipi[t]=(tipi[t]||0)+p;
 }

});

stats={tot,prof,canali,tipi};

mostra();
grafico("canali",canali,"Canali");
grafico("tipi",tipi,"Tipologie");
consigli();
}


function mostra(){

let m=(stats.prof/stats.tot*100)||0;

document.getElementById("totali").innerHTML=`
Vendite: <b>${stats.tot.toFixed(0)} €</b><br>
Profitto: <b>${stats.prof.toFixed(0)} €</b><br>
Margine: <b>${m.toFixed(1)}%</b>
`;
}


function grafico(id,obj,t){

let ctx=document.getElementById(id);

if(ctx.chart) ctx.chart.destroy();

ctx.chart=new Chart(ctx,{
 type:"bar",
 data:{
  labels:Object.keys(obj),
  datasets:[{
   label:t,
   data:Object.values(obj)
  }]
 }
});
}


function consigli(){

let bc=max(stats.canali);
let bt=max(stats.tipi);

let txt=`
🔥 Miglior canale: ${bc}<br>
💎 Miglior tipologia: ${bt}<br>
`;

if(stats.prof/stats.tot<0.3){
 txt+="⚠️ Margine basso<br>";
}

document.getElementById("insight").innerHTML=txt;
}


function ask(){

let q=document.getElementById("q").value.toLowerCase();
if(!q)return;

let r="";

if(q.includes("vend")){
 r="Vendi meglio su "+max(stats.canali);
}
else if(q.includes("compra")){
 r="Compra più "+max(stats.tipi);
}
else if(q.includes("profit")){
 r="Profitto: "+stats.prof.toFixed(0)+" €";
}
else{
 r="Concentrati su "+max(stats.tipi)+" e "+max(stats.canali);
}

let c=document.getElementById("chat");

c.innerHTML+=`<div><b>Tu:</b> ${q}</div>`;
c.innerHTML+=`<div><b>AI:</b> ${r}</div>`;

c.scrollTop=c.scrollHeight;

document.getElementById("q").value="";
}


function max(o){
 return Object.keys(o).reduce((a,b)=>o[a]>o[b]?a:b);
}

</script>

</body>
</html>
