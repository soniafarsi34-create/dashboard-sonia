<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Dashboard Sonia</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  font-family: Arial;
  background:#f2f4f8;
  padding:20px;
}

h1{text-align:center}

.box{
  background:white;
  padding:15px;
  margin:15px 0;
  border-radius:10px;
  box-shadow:0 0 10px #ddd;
}

button{
  width:100%;
  padding:12px;
  background:#6c63ff;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  margin-top:10px;
}

input{width:100%}

.stat{
  font-size:18px;
  margin:5px 0;
}
</style>
</head>

<body>

<h1>📊 Dashboard Business Sonia</h1>

<div class="box">
<h3>📂 Carica Excel / CSV</h3>
<input type="file" id="file">
<button onclick="load()">Analizza</button>
</div>

<div class="box">
<h3>💰 Totali</h3>
<div id="totali"></div>
</div>

<div class="box">
<h3>🏪 Canali</h3>
<canvas id="canali"></canvas>
</div>

<div class="box">
<h3>🎨 Tipologie</h3>
<canvas id="tipi"></canvas>
</div>

<div class="box">
<h3>📅 Mesi</h3>
<canvas id="mesi"></canvas>
</div>

<div class="box">
<h3>🌍 Clienti</h3>
<div id="clienti"></div>
</div>

<div class="box">
<h3>🤖 Intelligenza Artificiale</h3>
<div id="ai"></div>
</div>

<div class="box">
<h3>🏆 Top Vendite</h3>
<div id="top"></div>
</div>

<script>

let dati=[];

function load(){

const f=document.getElementById("file").files[0];
if(!f){alert("Carica un file!");return;}

const r=new FileReader();

r.onload=e=>{
 const wb=XLSX.read(e.target.result,{type:"binary"});
 const sh=wb.Sheets[wb.SheetNames[0]];
 dati=XLSX.utils.sheet_to_json(sh);
 analizza();
};

r.readAsBinaryString(f);
}


// ================= ANALISI =================

function analizza(){

let canali={},tipi={},mesi={},clienti={};

let tot=0, profit=0;

dati.forEach(r=>{

 let p=Number(r["prezzo di vendita"]||0);
 let pr=Number(r["profitto"]||0);

 let c=r["luogo di vendita"];
 let t=r["TIPOLOGIA"];
 let m=r["MeseNorm"];
 let cl=r["Nazionalita acquirente"];

 if(p>0){
  tot+=p;
  profit+=pr;

  if(c) canali[c]=(canali[c]||0)+p;
  if(t) tipi[t]=(tipi[t]||0)+p;
  if(m) mesi[m]=(mesi[m]||0)+p;
  if(cl) clienti[cl]=(clienti[cl]||0)+p;
 }
});

mostraTotali(tot,profit);
grafico("canali",canali,"Canali");
grafico("tipi",tipi,"Tipologie");
grafico("mesi",mesi,"Mesi");

mostraClienti(clienti);
topVendite();
intelligenza(canali,tipi,tot,profit);
}


// ================= UI =================

function mostraTotali(t,p){

document.getElementById("totali").innerHTML=`
<div class="stat">💶 Vendite: <b>${t.toFixed(2)} €</b></div>
<div class="stat">📈 Profitto: <b>${p.toFixed(2)} €</b></div>
<div class="stat">📊 Margine: <b>${((p/t)*100).toFixed(1)}%</b></div>
`;

}


function grafico(id,obj,titolo){

const ctx=document.getElementById(id);

if(ctx.chart) ctx.chart.destroy();

ctx.chart=new Chart(ctx,{
 type:"bar",
 data:{
  labels:Object.keys(obj),
  datasets:[{
   label:titolo,
   data:Object.values(obj)
  }]
 }
});

}


function mostraClienti(o){

let s=Object.entries(o)
.sort((a,b)=>b[1]-a[1])
.slice(0,5);

let h="";

s.forEach(x=>{
 h+=`🌍 ${x[0]} → ${x[1].toFixed(0)} €<br>`;
});

document.getElementById("clienti").innerHTML=h;

}


function topVendite(){

let top=dati
.filter(x=>x["prezzo di vendita"])
.sort((a,b)=>b["prezzo di vendita"]-a["prezzo di vendita"])
.slice(0,5);

let h="";

top.forEach(x=>{
 h+=`🏆 ${x["Merce venduta"]} → ${x["prezzo di vendita"]} €<br>`;
});

document.getElementById("top").innerHTML=h;

}


// ================= AI =================

function intelligenza(canali,tipi,tot,prof){

let bc=max(canali);
let wc=min(canali);

let bt=max(tipi);
let wt=min(tipi);

let txt=`
💡 Totale: ${tot.toFixed(0)} €<br><br>

🔥 Spingi su: <b>${bc}</b><br>
⚠️ Riduci: <b>${wc}</b><br><br>

💎 Compra più: <b>${bt}</b><br>
❌ Evita: <b>${wt}</b><br><br>
📈 Margine: ${(prof/tot*100).toFixed(1)}%
`;

if(prof/tot<0.3){
 txt+=`<br>⚠️ Margine basso → alza i prezzi`;
}

if(tot>100000){
 txt+=`<br>🚀 Livello business PRO`;
}

document.getElementById("ai").innerHTML=txt;

}


function max(o){
return Object.keys(o).reduce((a,b)=>o[a]>o[b]?a:b);
}

function min(o){
return Object.keys(o).reduce((a,b)=>o[a]<o[b]?a:b);
}

</script>

</body>
</html>
