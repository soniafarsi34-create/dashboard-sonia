<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Antiquarium Intelligence — Sonia</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
:root{
 --bg:#05070c;
 --card:#0d1119;
 --gold:#d4af37;
 --txt:#eee;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--txt);
 font-family:Inter,sans-serif;
}

header{
 background:#0a0e15;
 padding:18px 25px;
 display:flex;
 justify-content:space-between;
 flex-wrap:wrap;
 border-bottom:1px solid #1b1f2a;
}

header h2{color:var(--gold)}

nav a{
 color:var(--txt);
 margin:5px 10px;
 cursor:pointer;
 font-size:13px;
}

nav a:hover{color:var(--gold)}

.container{
 max-width:1700px;
 margin:auto;
 padding:25px;
}

.page{display:none}
.page.active{display:block}

.card{
 background:var(--card);
 border-radius:18px;
 padding:22px;
 margin-bottom:22px;
 border:1px solid #1b1f2a;
}

h3{color:var(--gold)}

input,select{
 width:100%;
 background:#080b12;
 border:1px solid #222;
 color:var(--txt);
 padding:9px;
 border-radius:8px;
 margin:5px 0;
}

button{
 background:var(--gold);
 color:black;
 border:none;
 padding:9px 16px;
 border-radius:8px;
 font-weight:700;
 cursor:pointer;
 margin:3px;
}

table{
 width:100%;
 border-collapse:collapse;
 font-size:13px;
}

th,td{
 padding:7px;
 border-bottom:1px solid #222;
}

th{color:var(--gold)}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:15px;
}

.kpi{
 background:#080b12;
 border:1px solid #222;
 border-radius:10px;
 padding:10px;
 text-align:center;
}

.kpi b{color:var(--gold);font-size:18px}

.chat{
 height:180px;
 overflow:auto;
 background:#080b12;
 border:1px solid #222;
 border-radius:10px;
 padding:8px;
}

.user{color:var(--gold)}
.ai{color:#fff}
</style>
</head>

<body>

<header>
<h2>ANTIQUARIUM · INTELLIGENCE</h2>

<nav>
<a onclick="go('dashboard')">Dashboard</a>
<a onclick="go('import')">Import</a>
<a onclick="go('sales')">Vendite</a>
<a onclick="go('analytics')">Analisi</a>
<a onclick="go('forecast')">Previsioni</a>
<a onclick="go('ai')">AI</a>
<a onclick="go('search')">Ricerca</a>
<a onclick="go('backup')">Backup</a>
</nav>
</header>

<div class="container">

<!-- DASHBOARD -->
<div id="dashboard" class="page active">

<div class="card">
<h3>📊 KPI Business</h3>
<div class="grid" id="kpi"></div>
</div>

<div class="card"><canvas id="revChart"></canvas></div>
<div class="card"><canvas id="profitChart"></canvas></div>

</div>

<!-- IMPORT -->
<div id="import" class="page">

<div class="card">

<h3>📂 Import Universale</h3>

<input type="file" id="fileInput">

<button onclick="importFile()">Analizza File</button>

<div id="importRes"></div>

</div>

</div>

<!-- SALES -->
<div id="sales" class="page">

<div class="card">

<h3>📁 Dati Importati</h3>

<table id="salesTable"></table>

</div>

</div>

<!-- ANALYTICS -->
<div id="analytics" class="page">

<div class="card"><canvas id="roiChart"></canvas></div>
<div class="card"><canvas id="catChart"></canvas></div>
<div class="card"><canvas id="epocaChart"></canvas></div>
<div class="card"><canvas id="channelChart"></canvas></div>

</div>

<!-- FORECAST -->
<div id="forecast" class="page">

<div class="card">

<button onclick="forecast()">Previsione AI</button>

<div id="forecastRes"></div>

</div>

</div>

<!-- AI -->
<div id="ai" class="page">

<div class="card">

<div class="chat" id="chat"></div>

<input id="q">

<button onclick="ask()">Invia</button>

</div>

</div>

<!-- SEARCH -->
<div id="search" class="page">

<div class="card">

<input id="searchTxt" placeholder="Cerca oggetto">

<button onclick="searchItem()">Cerca</button>

<div id="searchRes"></div>

<hr>

<input type="file" id="imgFile">

<button onclick="lens()">Google Lens</button>

</div>

</div>

<!-- BACKUP -->
<div id="backup" class="page">

<div class="card">

<button onclick="exportData()">Scarica Backup</button>

</div>

</div>

</div>

<script>

/* DB */

let data=[];

let charts={};

/* NAV */

function go(p){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(p).classList.add("active");
}

/* SAVE */

function save(){
 localStorage.setItem("antiquariumData",JSON.stringify(data));
}

function load(){
 data=JSON.parse(localStorage.getItem("antiquariumData")||"[]");
}

/* IMPORT */

function importFile(){

 let file=fileInput.files[0];

 if(!file){
  alert("Seleziona un file");
  return;
 }

 let reader=new FileReader();

 reader.onload=function(e){

  let txt=e.target.result;

  let sep=",";

  if(txt.includes(";")) sep=";";
  else if(txt.includes("\t")) sep="\t";

  Papa.parse(txt,{
   header:true,
   delimiter:sep,
   skipEmptyLines:true,

   complete:r=>{

    data=[];

    r.data.forEach(row=>{

     function g(k){
      return row[k]||row[k?.toLowerCase()]||"";
     }

     function num(v){
      return Number(
       String(v)
       .replace("€","")
       .replace("%","")
       .replace(",",".")
       .replace(/\s/g,"")
      )||0;
     }

     data.push({

      name: g("Merce venduta"),
      tipo: g("TIPOLOGIA"),
      luogoVend: g("luogo di vendita"),
      luogoAcq: g("luogo acquisto"),
      epoca: g("epoca"),

      mese: g("MeseNorm"),

      prezzo: num(g("prezzo di vendita")),
      costo: num(g("acquisto")),

      profitto: num(g("profitto")),
      margine: num(g("margine %")),

      canale: (
       g("proffitto negozio")?"Negozio":
       g("profitto proantic")?"Proantic":
       g("profitto antictore")?"Antictore":
       g("proffitto 1stdibs")?"1stdibs":
       g("proffitto instagram")?"Instagram":
       g("proffitto tuttoantico")?"TuttoAntico":"Altro"
      )

     });

    });

    save();
    render();

    importRes.innerHTML=`✔️ ${data.length} record caricati`;

   }

  });

 };

 reader.readAsText(file,"UTF-8");
}

/* RENDER */

function render(){

 renderTable();
 renderKPI();
 renderCharts();
 renderAI();
}

/* TABLE */

function renderTable(){

 let h="<tr><th>Nome</th><th>Tipo</th><th>Prezzo</th><th>Profitto</th><th>Epoca</th></tr>";

 data.forEach(x=>{
  h+=`
  <tr>
  <td>${x.name}</td>
  <td>${x.tipo}</td>
  <td>${x.prezzo}</td>
  <td>${x.profitto}</td>
  <td>${x.epoca}</td>
  </tr>`;
 });

 salesTable.innerHTML=h;
}

/* KPI */

function renderKPI(){

 let rev=sum("prezzo");
 let prof=sum("profitto");
 let avg=prof/(data.length||1);

 kpi.innerHTML=`

 <div class="kpi"><b>${rev}</b><br>Ricavi</div>
 <div class="kpi"><b>${prof}</b><br>Profitto</div>
 <div class="kpi"><b>${avg.toFixed(0)}</b><br>Media</div>
 <div class="kpi"><b>${data.length}</b><br>Record</div>

 `;
}

/* CHARTS */

function renderCharts(){

 let byMonth=group("mese","prezzo");
 let byCat=group("tipo","prezzo");
 let byEpoca=group("epoca","profitto");
 let byChannel=group("canale","profitto");

 draw("revChart","Ricavi per Mese",byMonth,"line");
 draw("profitChart","Profitto",byMonth,"bar");

 draw("roiChart","ROI per Tipo",byCat,"doughnut");
 draw("catChart","Categorie",byCat,"pie");

 draw("epocaChart","Epoche",byEpoca,"bar");
 draw("channelChart","Canali",byChannel,"pie");
}

function draw(id,label,obj,type){

 if(charts[id]) charts[id].destroy();

 charts[id]=new Chart(document.getElementById(id),{
  type,
  data:{
   labels:Object.keys(obj),
   datasets:[{
    label,
    data:Object.values(obj),
    backgroundColor:"#d4af37",
    borderColor:"#d4af37"
   }]
  }
 });
}

/* GROUP */

function group(k,v){

 let o={};

 data.forEach(x=>{
  if(x[k])
   o[x[k]]=(o[x[k]]||0)+x[v];
 });

 return o;
}

/* FORECAST */

function forecast(){

 let avg=sum("prezzo")/(data.length||1);

 let next=avg*1.25;

 forecastRes.innerHTML=`
 Previsto prossimo periodo: <b>${next.toFixed(0)}€</b>
 `;
}

/* AI */

function renderAI(){

 let prof=sum("profitto");

 let t="Sistema stabile.";

 if(prof<0) t="⚠️ Stai perdendo.";
 if(prof>0) t="✅ Crescita positiva.";

 chat.innerHTML=`<div class="ai">${t}</div>`;
}

function ask(){

 let v=q.value;

 chat.innerHTML+=`<div class="user">${v}</div>`;

 let r="Strategia: investi in epoche forti.";

 if(v.includes("perdo")) r="Riduci costi.";
 if(v.includes("canale")) r="Punta su 1stdibs.";

 setTimeout(()=>{
  chat.innerHTML+=`<div class="ai">${r}</div>`;
  chat.scrollTop=9999;
 },300);

 q.value="";
}

/* SEARCH */

function searchItem(){

 let t=searchTxt.value.toLowerCase();

 let r=data.filter(x=>x.name.toLowerCase().includes(t));

 let h="<ul>";

 r.forEach(x=>h+=`<li>${x.name} — ${x.prezzo}€</li>`);

 searchRes.innerHTML=h+"</ul>";
}

/* LENS */

function lens(){

 if(!imgFile.files[0]) return alert("Carica immagine");

 window.open("https://lens.google.com/upload","_blank");
}

/* BACKUP */

function exportData(){

 let blob=new Blob([JSON.stringify(data)],{type:"application/json"});

 let a=document.createElement("a");

 a.href=URL.createObjectURL(blob);
 a.download="antiquarium_backup.json";
 a.click();
}

/* UTILS */

function sum(k){
 return data.reduce((a,b)=>a+(b[k]||0),0);
}

/* INIT */

load();
render();

</script>

</body>
</html>
