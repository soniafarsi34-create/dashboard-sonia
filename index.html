<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Antiquarium Ultimate AI — Sonia</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
:root{
 --bg:#05070c;
 --card:#0d1119;
 --gold:#d4af37;
 --txt:#eee;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--txt);
 font-family:Inter,sans-serif;
}

header{
 background:#0a0e15;
 padding:18px 25px;
 display:flex;
 justify-content:space-between;
 flex-wrap:wrap;
 border-bottom:1px solid #1b1f2a;
}

header h2{color:var(--gold)}

nav a{
 color:var(--txt);
 margin:5px 10px;
 cursor:pointer;
 font-size:13px;
}

nav a:hover{color:var(--gold)}

.container{
 max-width:1700px;
 margin:auto;
 padding:25px;
}

.page{display:none}
.page.active{display:block}

.card{
 background:var(--card);
 border-radius:18px;
 padding:22px;
 margin-bottom:22px;
 border:1px solid #1b1f2a;
}

h3{color:var(--gold)}

input,select{
 width:100%;
 background:#080b12;
 border:1px solid #222;
 color:var(--txt);
 padding:9px;
 border-radius:8px;
 margin:5px 0;
}

button{
 background:var(--gold);
 color:black;
 border:none;
 padding:9px 16px;
 border-radius:8px;
 font-weight:700;
 cursor:pointer;
 margin:3px;
}

table{
 width:100%;
 border-collapse:collapse;
 font-size:13px;
}

th,td{
 padding:7px;
 border-bottom:1px solid #222;
}

th{color:var(--gold)}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:15px;
}

.kpi{
 background:#080b12;
 border:1px solid #222;
 border-radius:10px;
 padding:10px;
 text-align:center;
}

.kpi b{color:var(--gold);font-size:18px}

.chat{
 height:180px;
 overflow:auto;
 background:#080b12;
 border:1px solid #222;
 border-radius:10px;
 padding:8px;
}

.user{color:var(--gold)}
.ai{color:#fff}
</style>
</head>

<body>

<header>
<h2>ANTIQUARIUM · ULTIMATE AI</h2>

<nav>
<a onclick="go('dashboard')">Dashboard</a>
<a onclick="go('sales')">Vendite</a>
<a onclick="go('buys')">Acquisti</a>
<a onclick="go('stock')">Magazzino</a>
<a onclick="go('analytics')">Analytics</a>
<a onclick="go('forecast')">Previsioni</a>
<a onclick="go('settings')">Grafici</a>
<a onclick="go('search')">Ricerca</a>
<a onclick="go('import')">Import</a>
<a onclick="go('ai')">AI</a>
<a onclick="go('backup')">Backup</a>
</nav>
</header>

<div class="container">

<!-- DASHBOARD -->
<div id="dashboard" class="page active">

<div class="card">
<h3>📊 KPI Avanzati</h3>
<div class="grid" id="kpi"></div>
</div>

<div class="card"><canvas id="revChart"></canvas></div>
<div class="card"><canvas id="cashChart"></canvas></div>

</div>

<!-- SALES -->
<div id="sales" class="page">

<div class="card">
<h3>➕ Vendita</h3>

<input id="s_name" placeholder="Nome">
<input id="s_cat" placeholder="Categoria">
<input id="s_price" placeholder="Prezzo">
<input id="s_cost" placeholder="Costo">
<input id="s_date" type="date">

<button onclick="addSale()">Salva</button>
</div>

<div class="card"><table id="salesTable"></table></div>

</div>

<!-- BUYS -->
<div id="buys" class="page">

<div class="card">

<input id="b_name" placeholder="Nome">
<input id="b_cat" placeholder="Categoria">
<input id="b_price" placeholder="Prezzo">
<input id="b_date" type="date">

<button onclick="addBuy()">Salva</button>

</div>

<div class="card"><table id="buysTable"></table></div>

</div>

<!-- STOCK -->
<div id="stock" class="page">

<div class="card"><table id="stockTable"></table></div>

</div>

<!-- ANALYTICS -->
<div id="analytics" class="page">

<div class="card"><canvas id="profitChart"></canvas></div>
<div class="card"><canvas id="roiChart"></canvas></div>
<div class="card"><canvas id="catChart"></canvas></div>
<div class="card"><canvas id="rotChart"></canvas></div>

</div>

<!-- FORECAST -->
<div id="forecast" class="page">

<div class="card">

<button onclick="forecast()">Calcola</button>

<div id="forecastRes"></div>

</div>

</div>

<!-- SETTINGS -->
<div id="settings" class="page">

<div class="card">

<h3>🎨 Impostazioni Grafici</h3>

<select id="chartType">
<option>line</option>
<option>bar</option>
<option>pie</option>
<option>doughnut</option>
</select>

<input type="color" id="chartColor" value="#d4af37">

<button onclick="applySettings()">Applica</button>

</div>

</div>

<!-- SEARCH -->
<div id="search" class="page">

<div class="card">

<input id="searchTxt" placeholder="Cerca...">

<button onclick="searchItem()">Cerca</button>

<div id="searchRes"></div>

<hr>

<input type="file" id="imgFile">

<button onclick="lens()">Google Lens</button>

</div>

</div>

<!-- IMPORT -->
<div id="import" class="page">

<div class="card">

<input type="file" id="fileInput" accept=".csv">

<button onclick="importFile()">Analizza File</button>

<div id="importRes"></div>

</div>

</div>

<!-- AI -->
<div id="ai" class="page">

<div class="card">

<div class="chat" id="chat"></div>

<input id="q">

<button onclick="ask()">Invia</button>

</div>

</div>

<!-- BACKUP -->
<div id="backup" class="page">

<div class="card">

<button onclick="exportData()">Backup</button>

</div>

</div>

</div>

<script>

/* DB */

let sales=JSON.parse(localStorage.getItem("sales")||"[]");
let buys=JSON.parse(localStorage.getItem("buys")||"[]");

let chartType="line";
let chartColor="#d4af37";

let charts={};

/* NAV */

function go(p){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(p).classList.add("active");
}

/* SAVE */

function save(){
 localStorage.setItem("sales",JSON.stringify(sales));
 localStorage.setItem("buys",JSON.stringify(buys));
}

/* ADD */

function addSale(){

 if(!s_name.value||!s_price.value)return;

 sales.push({
  name:s_name.value,
  cat:s_cat.value,
  price:+s_price.value,
  cost:+s_cost.value,
  date:s_date.value
 });

 save(); clear(); render();
}

function addBuy(){

 if(!b_name.value||!b_price.value)return;

 buys.push({
  name:b_name.value,
  cat:b_cat.value,
  price:+b_price.value,
  date:b_date.value
 });

 save(); clear(); render();
}

function clear(){

 [s_name,s_cat,s_price,s_cost,s_date,
  b_name,b_cat,b_price,b_date]
 .forEach(x=>x.value="");
}

/* MAIN */

function render(){

 renderTables();
 renderKPI();
 renderCharts();
 renderAI();
}

/* TABLES */

function renderTables(){

 let s="<tr><th>Nome</th><th>Cat</th><th>Prezzo</th><th>Profitto</th></tr>";

 sales.forEach(x=>{
  s+=`<tr><td>${x.name}</td><td>${x.cat}</td><td>${x.price}</td><td>${x.price-x.cost}</td></tr>`;
 });

 salesTable.innerHTML=s;

 let b="<tr><th>Nome</th><th>Cat</th><th>Prezzo</th></tr>";

 buys.forEach(x=>{
  b+=`<tr><td>${x.name}</td><td>${x.cat}</td><td>${x.price}</td></tr>`;
 });

 buysTable.innerHTML=b;

 let sold=sales.map(x=>x.name);

 let st="<tr><th>Nome</th><th>Cat</th><th>Stato</th></tr>";

 buys.forEach(x=>{
  st+=`<tr><td>${x.name}</td><td>${x.cat}</td><td>${sold.includes(x.name)?"Venduto":"Stock"}</td></tr>`;
 });

 stockTable.innerHTML=st;
}

/* KPI */

function renderKPI(){

 let rev=sum(sales,"price");
 let cost=sum(buys,"price");
 let prof=rev-cost;

 let roi=(prof/cost*100)||0;

 kpi.innerHTML=`

 <div class="kpi"><b>${rev}</b><br>Entrate</div>
 <div class="kpi"><b>${cost}</b><br>Uscite</div>
 <div class="kpi"><b>${prof}</b><br>Utile</div>
 <div class="kpi"><b>${roi.toFixed(1)}%</b><br>ROI</div>
 <div class="kpi"><b>${sales.length}</b><br>Vendite</div>
 <div class="kpi"><b>${buys.length}</b><br>Acquisti</div>

 `;
}

/* CHARTS */

function renderCharts(){

 let month={};
 let cash={};
 let cat={};
 let rot={};

 sales.forEach(s=>{

  let m=s.date?.slice(0,7);

  if(m){
   month[m]=(month[m]||0)+s.price;
   cash[m]=(cash[m]||0)+(s.price-s.cost);
  }

  cat[s.cat]=(cat[s.cat]||0)+s.price;

  rot[s.name]=(rot[s.name]||0)+1;
 });

 draw("revChart","Ricavi",month);
 draw("cashChart","Cashflow",cash);
 draw("profitChart","Profitto",objMap(s=>s.price-s.cost));
 draw("roiChart","ROI %",objMap(s=>((s.price-s.cost)/s.cost*100)||0));
 draw("catChart","Categorie",cat);
 draw("rotChart","Rotazione",rot);
}

function draw(id,label,obj){

 if(charts[id]) charts[id].destroy();

 charts[id]=new Chart(document.getElementById(id),{
  type:chartType,
  data:{
   labels:Object.keys(obj),
   datasets:[{
    label,
    data:Object.values(obj),
    backgroundColor:chartColor,
    borderColor:chartColor
   }]
  }
 });
}

function objMap(fn){

 let o={};

 sales.forEach(x=>o[x.name]=fn(x));

 return o;
}

/* FORECAST */

function forecast(){

 let avg=sum(sales,"price")/(sales.length||1);

 let next=avg*1.2;

 forecastRes.innerHTML=`
 Previsto: <b>${next.toFixed(0)}€</b><br>
 Trend: +20%
 `;
}

/* SETTINGS */

function applySettings(){

 chartType=chartType.value;
 chartColor=chartColor.value;

 renderCharts();
}

/* SEARCH */

function searchItem(){

 let t=searchTxt.value.toLowerCase();

 let r=sales.filter(x=>x.name.toLowerCase().includes(t));

 let h="<ul>";

 r.forEach(x=>h+=`<li>${x.name} — ${x.price}€</li>`);

 searchRes.innerHTML=h+"</ul>";
}

/* LENS */

function lens(){

 if(!imgFile.files[0]) return alert("Carica immagine");

 window.open("https://lens.google.com/upload","_blank");
}

/* IMPORT */

function importFile(){

 let f=fileInput.files[0];

 if(!f)return alert("Seleziona CSV");

 Papa.parse(f,{
  header:true,
  skipEmptyLines:true,
  complete:r=>{

   let c=0;

   r.data.forEach(x=>{

    let n=x.nome||x.Nome||x.prodotto||x.articolo;
    let p=x.prezzo||x.importo||x.totale;
    let co=x.costo||0;
    let d=x.data||"";

    if(n&&p){

     sales.push({
      name:n,
      cat:"Import",
      price:+p,
      cost:+co,
      date:d
     });

     c++;
    }
   });

   save();
   render();

   importRes.innerHTML=`✔️ ${c} record analizzati`;
  }
 });
}

/* AI */

function renderAI(){

 let rev=sum(sales,"price");
 let cost=sum(buys,"price");

 let t="Sistema stabile.";

 if(cost>rev) t="⚠️ Uscite troppo alte.";
 if(rev>cost) t="✅ Crescita positiva.";

 chat.innerHTML=`<div class="ai">${t}</div>`;
}

function ask(){

 let v=q.value;

 chat.innerHTML+=`<div class="user">${v}</div>`;

 let r="Strategia: punta su opere certificate.";

 if(v.includes("invest")) r="Compra nei mesi deboli.";
 if(v.includes("perdo")) r="Riduci costi.";

 setTimeout(()=>{
  chat.innerHTML+=`<div class="ai">${r}</div>`;
  chat.scrollTop=9999;
 },300);

 q.value="";
}

/* BACKUP */

function exportData(){

 let data={sales,buys};

 let blob=new Blob([JSON.stringify(data)],{type:"application/json"});

 let a=document.createElement("a");

 a.href=URL.createObjectURL(blob);
 a.download="backup_ultimate.json";
 a.click();
}

/* TOOLS */

function sum(a,f){
 return a.reduce((x,y)=>x+y[f],0);
}

/* INIT */

render();

</script>

</body>
</html>
