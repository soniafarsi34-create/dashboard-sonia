<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Antiquarium Intelligence — Sonia</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#06080d;
 --card:#0e121a;
 --gold:#d4af37;
 --txt:#f2f2f2;
 --muted:#888;
}
body{
 margin:0;
 background:var(--bg);
 color:var(--txt);
 font-family:Inter,sans-serif;
}
header{
 background:#0b0f16;
 padding:18px 30px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #1b1f29;
}
header h2{color:var(--gold)}
.container{max-width:1200px;margin:auto;padding:25px}
.card{
 background:var(--card);
 border-radius:20px;
 padding:25px;
 margin-bottom:25px;
 border:1px solid #1c2030;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:15px;
}
.kpi{
 background:#0b0f16;
 border:1px solid #222;
 border-radius:14px;
 padding:15px;
 text-align:center;
}
.kpi b{color:var(--gold);font-size:22px}
button{
 background:var(--gold);
 color:black;
 border:none;
 padding:12px 20px;
 border-radius:10px;
 font-weight:700;
 cursor:pointer;
}
input{width:100%;margin:8px 0;padding:10px;background:#0b0f16;color:white;border:1px solid #222;border-radius:8px}
</style>
</head>

<body>

<header>
<h2>ANTIQUARIUM · INTELLIGENCE</h2>
</header>

<div class="container">

<div class="card">
<h3>📂 Importa Vendite</h3>
<input type="file" id="file">
<button onclick="load()">Analizza</button>
</div>

<div class="card">
<h3>📊 Indicatori Chiave (30 fattori)</h3>
<div class="grid" id="kpi"></div>
</div>

<div class="card">
<h3>🧠 Strategia AI</h3>
<div id="ai"></div>
</div>

</div>

<script>
let data=[];

function load(){
 let f=document.getElementById("file").files[0];
 if(!f)return;
 let r=new FileReader();
 r.onload=e=>{
  let wb=XLSX.read(e.target.result,{type:"binary"});
  let sh=wb.Sheets[wb.SheetNames[0]];
  data=XLSX.utils.sheet_to_json(sh);
  analyze();
 };
 r.readAsBinaryString(f);
}

function analyze(){
 let tot=0,prof=0,count=0;
 let cat={},chan={};

 data.forEach(r=>{
  let p=+r["prezzo di vendita"]||0;
  let pr=+r["profitto"]||0;
  let t=r["TIPOLOGIA"];
  let c=r["luogo di vendita"];
  if(p){
   tot+=p; prof+=pr; count++;
   if(t) cat[t]=(cat[t]||0)+p;
   if(c) chan[c]=(chan[c]||0)+p;
  }
 });

 let margin=(prof/tot*100)||0;
 let avg=tot/count||0;
 let bestCat=max(cat), bestChan=max(chan);
 let worstCat=min(cat), worstChan=min(chan);

 document.getElementById("kpi").innerHTML=`
 <div class="kpi"><b>${tot.toFixed(0)}€</b><br>Fatturato</div>
 <div class="kpi"><b>${prof.toFixed(0)}€</b><br>Profitto</div>
 <div class="kpi"><b>${margin.toFixed(1)}%</b><br>Margine</div>
 <div class="kpi"><b>${avg.toFixed(0)}€</b><br>Prezzo medio</div>
 <div class="kpi"><b>${count}</b><br>Pezzi venduti</div>
 <div class="kpi"><b>${bestCat}</b><br>Categoria top</div>
 <div class="kpi"><b>${worstCat}</b><br>Categoria debole</div>
 <div class="kpi"><b>${bestChan}</b><br>Canale top</div>
 <div class="kpi"><b>${worstChan}</b><br>Canale debole</div>
 <div class="kpi"><b>${Object.keys(cat).length}</b><br>Diversificazione</div>
 `;

 let ai=`
 🔥 Spingi su <b>${bestCat}</b> tramite <b>${bestChan}</b><br><br>
 💎 Compra più pezzi simili a ${bestCat}<br>
 ⚠️ Riduci acquisti di ${worstCat}<br>
 📈 Aumenta prezzi del ${margin<30?10:5}% sui bestseller<br>
 🧠 Strategia: qualità, rarità, rotazione rapida
 `;
 document.getElementById("ai").innerHTML=ai;
}

function max(o){return Object.keys(o).reduce((a,b)=>o[a]>o[b]?a:b)}
function min(o){return Object.keys(o).reduce((a,b)=>o[a]<o[b]?a:b)}
</script>

</body>
</html>
